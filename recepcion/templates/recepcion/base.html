{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Bolsines{% endblock %}</title>
  <style>
    :root {
      --fondo: #f4f6f8;
      --panel: #ffffff;
      --borde: #d8dee4;
      --texto: #1c2530;
      --tenue: #5d6b7a;
      --acento: #1f5fa8;
      --acento-suave: #e8f0fa;
      --ok: #1b7f4d;
      --ok-suave: #e6f4ec;
      --alerta: #9a6700;
      --alerta-suave: #fdf5e2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font: 15px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    header {
      background: var(--acento);
      color: #fff;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 17px; font-weight: 600; }
    header p { margin: 3px 0 0; font-size: 13px; opacity: .85; }
    header nav { display: flex; gap: 6px; }
    header nav a {
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, .35);
    }
    header nav a:hover { background: rgba(255, 255, 255, .16); }
    main { max-width: 940px; margin: 0 auto; padding: 26px 20px 60px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--borde);
      border-radius: 8px;
      padding: 20px 22px;
      margin-bottom: 18px;
    }
    .panel h2 {
      margin: 0 0 14px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--tenue);
      font-weight: 600;
    }
    .cm { font-size: 19px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--borde); }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--tenue); }
    tbody tr:last-child td { border-bottom: none; }
    .seleccionada { background: var(--acento-suave); }
    button {
      font: inherit;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid var(--borde);
      background: #fff;
      padding: 7px 14px;
    }
    button:hover { border-color: var(--acento); color: var(--acento); }
    button.primario {
      background: var(--acento);
      border-color: var(--acento);
      color: #fff;
      font-weight: 600;
    }
    button.primario:hover { background: #17497f; color: #fff; }
    .opcion {
      display: block;
      border: 1px solid var(--borde);
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 9px;
      background: #fff;
      width: 100%;
      text-align: left;
    }
    .opcion:hover { border-color: var(--acento); background: var(--acento-suave); }
    .opcion .n { font-weight: 600; color: var(--acento); margin-right: 8px; }
    .remito { border: 1px solid var(--borde); border-radius: 6px; margin-bottom: 12px; }
    .remito h3 {
      margin: 0;
      padding: 10px 14px;
      font-size: 14px;
      background: #f8fafc;
      border-bottom: 1px solid var(--borde);
    }
    .remito table { margin: 0; }
    .aviso {
      border-left: 3px solid var(--alerta);
      background: var(--alerta-suave);
      padding: 12px 16px;
      border-radius: 0 6px 6px 0;
    }
    .exito {
      border-left: 3px solid var(--ok);
      background: var(--ok-suave);
      padding: 14px 18px;
      border-radius: 0 6px 6px 0;
    }
    .exito strong { color: var(--ok); }
    .acciones { display: flex; gap: 10px; margin-top: 16px; }
    .tenue { color: var(--tenue); font-size: 13px; }
    a.volver { color: var(--acento); text-decoration: none; font-size: 14px; }
    a.volver:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Sistema Bolsines</h1>
      <p>CU 28 — Registrar recepción de bolsín</p>
    </div>
    <nav>
      <a href="{% url 'registrarRecepcion' %}">Registrar recepción</a>
      <a href="{% url 'historial' %}">Historial</a>
    </nav>
  </header>
  <main>
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
